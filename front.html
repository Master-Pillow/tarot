<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Mạng Xã Hội - Bóc Trần Nhân Cách</title>
    <!-- Nhúng Font Be Vietnam Pro hỗ trợ Tiếng Việt chuẩn 100% -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <!-- Thư viện tạo mã QR tự động -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Reset & Base Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at center, #240046 0%, #0d001a 100%);
            color: #f1e4c3; 
            font-family: 'Be Vietnam Pro', sans-serif;
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng nền không gian vũ trụ */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(2px 2px at 20px 30px, #ffd700, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 90px 40px, #ff007a, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.35;
            animation: stars 4s infinite linear;
        }

        @keyframes stars {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        #app { 
            width: 100%; 
            max-width: 480px; 
            padding: 20px; 
            text-align: center; 
            position: relative;
            z-index: 10;
        }
        
        /* Phong cách Tarot Khung Kính */
        .tarot-card { 
            background: rgba(25, 10, 50, 0.85); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 2px solid #e0a96d; 
            border-radius: 24px; 
            padding: 35px 22px; 
            box-shadow: 0 0 35px rgba(224, 169, 109, 0.25), inset 0 0 15px rgba(224, 169, 109, 0.1); 
            position: relative;
        }

        .tarot-card::after, .tarot-card::before {
            content: "✦";
            position: absolute;
            top: 12px;
            color: #e0a96d;
            font-size: 1.2rem;
        }
        .tarot-card::after { right: 15px; }
        .tarot-card::before { left: 15px; }

        h1 {
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        
        /* Nút bấm Tarot chính giữa */
        .btn-tarot { 
            background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); 
            border: 2px solid #fff3cd; 
            color: #ffffff; 
            padding: 20px 25px; 
            font-size: 1.25rem; 
            font-weight: 700; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%; 
            font-family: 'Be Vietnam Pro', sans-serif;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.5);
            animation: pulse-gold 2s infinite;
        }

        .btn-tarot:hover { 
            transform: scale(1.03); 
            box-shadow: 0 0 35px rgba(243, 156, 18, 0.8); 
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); }
            100% { box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }
        }

        .btn-outline { 
            background: transparent; 
            border: 1px solid #e0a96d; 
            color: #e0a96d;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.95rem;
        }
        
        /* Hiệu ứng Quả cầu thủy tinh */
        .crystal-ball {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: float 2.5s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Thanh Loading */
        .loading-container { 
            width: 100%; 
            height: 14px; 
            background: rgba(255,255,255,0.08); 
            border: 1px solid #e0a96d;
            border-radius: 10px; 
            margin: 20px 0; 
            overflow: hidden; 
        }
        .loading-bar { 
            height: 100%; 
            width: 0%; 
            background: linear-gradient(90deg, #f39c12, #e74c3c, #9b59b6); 
            transition: width 0.1s linear; 
        }
        .loading-text { 
            font-style: italic; 
            color: #f39c12; 
            margin-top: 10px; 
            min-height: 24px; 
            font-size: 1.05rem; 
            font-weight: 600;
        }
        
        /* Màn hình lá bài */
        .tarot-frame {
            border: 2px dashed #e0a96d;
            border-radius: 16px;
            padding: 25px 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            animation: flipIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes flipIn {
            0% { transform: rotateY(90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .card-emoji { font-size: 4.5rem; margin-bottom: 12px; }
        .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 15px; color: #ffd700; text-transform: uppercase; }
        .card-desc { font-size: 1.1rem; line-height: 1.6; color: #e2d5f8; font-style: italic; }
        
        #qrcode { display: flex; justify-content: center; margin: 20px 0; background: #fff; padding: 15px; border-radius: 12px; border: 3px solid #e0a96d; }
    </style>
</head>
<body>
    <div id="app" class="tarot-card"></div>

    <script>
        // 30 Tụ bài Tarot Mạng Xã Hội với Font tiếng Việt chuẩn
        const tarotCards = [
            { emoji: "🐸", title: "Lá Bài: Chúa Tể Lướt Feed", desc: "Vũ trụ thấy bạn lướt không mệt mỏi. Ngón tay cuồn cuộn cơ bắp nhưng tuyệt đối lặn sâu không để lại dấu vết." },
            { emoji: "👀", title: "Lá Bài: Thánh Hóng Drama", desc: "Tần số tâm linh của bạn bắt sóng biến cố siêu nhạy. Nơi nào có bóc phốt, nơi đó có bước chân bạn." },
            { emoji: "❤️", title: "Lá Bài: Máy Phát Tim Di Động", desc: "Trái tim bạn bao la như đại dương. Dành cả thanh xuân thả tim dạo bất chấp nội dung." },
            { emoji: "🕵️", title: "Lá Bài: Đặc Vụ Online", desc: "Khả năng thấu thị tâm linh đỉnh cao. Tìm ra thông tin người khác qua bóng lưng trong 3 nốt nhạc." },
            { emoji: "📱", title: "Lá Bài: Nạn Nhân Thuật Toán", desc: "Bị thần thế giới ảo thao túng. Định mở app 5 phút nhưng ngẩng đầu lên đã 3 giờ sáng." },
            { emoji: "🎬", title: "Lá Bài: Đạo Diễn Trong Đầu", desc: "Nghĩ ra vô số kịch bản triệu view trên mạng nhưng thực tế không bao giờ dám bấm quay." },
            { emoji: "🫥", title: "Lá Bài: Bóng Ma Thả Tim", desc: "Xem story trong âm thầm. Thoắt ẩn thoắt hiện như một vị thần, tuyệt đối không bình luận." },
            { emoji: "🚀", title: "Lá Bài: Chiến Thần Bắt Trend", desc: "Năng lượng bắt nhịp cực mạnh. Trend vừa xuất hiện 5 phút là bạn đã thông thuộc." },
            { emoji: "💬", title: "Lá Bài: Tổng Đài Bình Luận", desc: "Nơi nào có tranh cãi, nơi đó có lời phán xét chí mạng của bạn." },
            { emoji: "🔋", title: "Lá Bài: Pin 1% Vẫn Cố", desc: "Điện thoại báo đỏ nhưng ngọn lửa cày view trong tâm trí bạn vẫn cháy rực rỡ." },
            { emoji: "🛍️", title: "Lá Bài: Chốt Đơn Vô Thức", desc: "Số mệnh định sẵn tiềm lực tài chính đi lùi mỗi khi xem livestream nửa đêm." },
            { emoji: "🎧", title: "Lá Bài: Nạn Nhân Âm Thanh", desc: "Bị ám ảnh bởi nhạc viral. Đi tắm hay đi ngủ trong đầu vẫn vang lên giai điệu TikTok." },
            { emoji: "📸", title: "Lá Bài: Nhiếp Ảnh Ẩn Danh", desc: "Chụp 100 tấm, chỉnh sửa 3 tiếng qua 7749 ứng dụng nhưng cuối cùng… cất kho không đăng." },
            { emoji: "🧠", title: "Lá Bài: Bách Khoa Comment", desc: "Độ thông thái nằm ở phần bình luận. Đọc comment thấy giải trí hơn cả xem video." },
            { emoji: "🧟", title: "Lá Bài: Cú Đêm Online", desc: "Năng lượng bùng nổ vào khung giờ âm binh. Sáng ra đi học đi làm như một bóng ma." },
            { emoji: "🫡", title: "Lá Bài: Hệ Tâm Linh", desc: "Tin vào thông điệp vũ trụ, nghiện bói Tarot và check cung hoàng đạo mỗi ngày." },
            { emoji: "🧹", title: "Lá Bài: Chiến Binh Dọn Bạn", desc: "Định kỳ thanh lọc danh sách bạn bè như lễ nghi dọn nhà đón may mắn." },
            { emoji: "🗣️", title: "Lá Bài: Chuyên Gia Meme", desc: "Giao tiếp 100% bằng hình ảnh meme hài hước, từ chối ngôn ngữ thông thường." },
            { emoji: "🎭", title: "Lá Bài: Diễn Viên Hai Mặt", desc: "Nick chính đạo lý nghiêm túc, nick clone thì quậy đục nước cõi mạng." },
            { emoji: "🧊", title: "Lá Bài: Trái Tim Băng Giá", desc: "Người ta gửi tin nhắn dài 3 trang A4, bạn phản ứng lại bằng đúng một chữ 'Ok'." },
            { emoji: "📢", title: "Lá Bài: Đại Sứ Chia Sẻ", desc: "Thấy bài là ấn Share về tường nhà, dù chính bản thân cũng chưa từng đọc hết." },
            { emoji: "🤳", title: "Lá Bài: Kẻ Mộng Mơ", desc: "Chụp ảnh nghệ thuật check-in sang chảnh nhưng lượng tương tác toàn người nhà." },
            { emoji: "🧩", title: "Lá Bài: Đọc Vị Thuật Toán", desc: "Hiểu thấu quy luật mạng xã hội, tính toán đúng giờ vàng để đăng bài lên xu hướng." },
            { emoji: "🙈", title: "Lá Bài: Lướt Trong Lén Lút", desc: "Bề ngoài tỏ vẻ không quan tâm, tối về âm thầm lập nick ảo đi stalk." },
            { emoji: "🧃", title: "Lá Bài: Nghiện Chữa Lành", desc: "Tìm kiếm sự bình yên tâm hồn qua các video nặn mụn, cắt cỏ, rửa sân." },
            { emoji: "🧑‍💻", title: "Lá Bài: Admin Bất Đắc Dĩ", desc: "Lập group chat xôm tụ rồi tự mình độc thoại mỗi ngày vì không ai rep." },
            { emoji: "🧭", title: "Lá Bài: Kẻ Lang Thăng", desc: "Vòng xoáy vô định: Nhảy từ Facebook sang TikTok rồi Insta lặp lại mỗi 5 phút." },
            { emoji: "🪄", title: "Lá Bài: Phù Thủy Filter", desc: "Từ chối camera thường. Luôn cần màng lọc phép thuật gánh vóc dáng nhan sắc." },
            { emoji: "📚", title: "Lá Bài: Tri Thức Ngắn", desc: "Toàn bộ vốn sống và tri thức thế giới được thu nạp qua video ngắn 15 giây." },
            { emoji: "🌱", title: "Lá Bài: Linh Hồn Thuần Khiết", desc: "Mở app 30 phút rồi tự giác đóng. Sinh vật thuần khiết hiếm hoi chưa bị tha hóa." }
        ];

        const mysticMessages = [
            "🔮 Đang kết nối với vũ trụ mạng xã hội...",
            "📜 Đang giải mã lịch sử duyệt web...",
            "✨ Đang lật mở các tầng tâm linh...",
            "🧿 Đang quét danh sách người yêu cũ...",
            "👁️ Thần thuật toán đang nhìn thấu bạn..."
        ];

        const appDiv = document.getElementById('app');
        const urlParams = new URLSearchParams(window.location.search);
        
        // Mặc định: Nếu trên URL chưa có ?play=1 (tức là mở lần đầu trên máy tính), sẽ tự chọn chế độ chiếu.
        // Khi quét QR (URL có ?play=1), sẽ vào THẲNG MÀN HÌNH TAROT.
        const isPlayDirectly = urlParams.get('play') === '1';

        function init() {
            if (isPlayDirectly) {
                renderAudienceStart();
            } else {
                renderPresenter();
            }
        }

        // Màn hình Tạo Mã QR (Chiếu lên Slide máy tính)
        function renderPresenter() {
            appDiv.innerHTML = `
                <h1 style="color: #ffd700; font-size: 1.6rem;">QUÉT MÃ RÚT BÀI TAROT</h1>
                <p style="color: #e0a96d; margin-top: 5px; font-size: 0.95rem;">Khán giả quét mã này để vào thẳng trang Tarot!</p>
                <div id="qrcode"></div>
                <button class="btn-outline" onclick="renderAudienceStart()">Chơi Thử Ngay Trên Máy Này</button>
            `;
            
            // Tự tạo link chứa ?play=1 để khi quét mã QR sẽ VÀO THẲNG GIAO DIỆN CHƠI
            const currentUrl = window.location.href.split('?')[0];
            const directPlayUrl = currentUrl + "?play=1";
            
            new QRCode(document.getElementById("qrcode"), {
                text: directPlayUrl,
                width: 220,
                height: 220,
                colorDark : "#1a0033",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // GIAO DIỆN CHÍNH KHI QUÉT MÃ QR: Hiện trực tiếp Tarot bóc phốt + Nút bấm duy nhất
        function renderAudienceStart() {
            appDiv.innerHTML = `
                <div class="crystal-ball">🔮</div>
                <h1 style="font-size: 1.8rem; margin-bottom: 10px; color: #ffd700;">TAROT BÓC PHỐT</h1>
                <p style="margin-bottom: 30px; color: #c4b3e3; font-size: 1rem; line-height: 1.5;">Vũ trụ sắp bóc trần nhân cách và thói quen ẩn giấu của bạn trên Mạng Xã Hội...</p>
                
                <!-- Nút bấm chính ở giữa màn hình -->
                <button class="btn-tarot" onclick="startLoading()">RÚT BÀI KHÁM PHÁ BẢN THÂN</button>
            `;
        }

        // Hiệu ứng giải mã Tarot
        function startLoading() {
            appDiv.innerHTML = `
                <div class="crystal-ball" style="font-size: 3rem;">✨</div>
                <h1 style="color: #ffd700; font-size: 1.3rem;">ĐANG GIẢI MÃ LÁ BÀI...</h1>
                <div class="loading-container">
                    <div class="loading-bar" id="loadBar"></div>
                </div>
                <div class="loading-text" id="loadText">Đang khai mở luân xa dữ liệu...</div>
            `;

            const loadBar = document.getElementById('loadBar');
            const loadText = document.getElementById('loadText');
            
            let progress = 0;
            let messageIndex = 0;
            
            const textInterval = setInterval(() => {
                if (messageIndex < mysticMessages.length) {
                    loadText.innerText = mysticMessages[messageIndex];
                    messageIndex++;
                }
            }, 600);

            const barInterval = setInterval(() => {
                progress += 2; 
                loadBar.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(textInterval);
                    clearInterval(barInterval);
                    setTimeout(showResult, 200);
                }
            }, 30); 
        }

        // Màn hình kết quả
        function showResult() {
            const randomCard = tarotCards[Math.floor(Math.random() * tarotCards.length)];
            
            appDiv.innerHTML = `
                <div class="tarot-frame">
                    <div class="card-emoji">${randomCard.emoji}</div>
                    <div class="card-title">${randomCard.title}</div>
                    <div class="card-desc">"${randomCard.desc}"</div>
                </div>
                <button class="btn-tarot" style="padding: 15px 20px; font-size: 1.05rem;" onclick="renderAudienceStart()">RÚT LẠI LÁ BÀI KHÁC</button>
            `;
        }

        init();
    </script>
</body>
</html>
